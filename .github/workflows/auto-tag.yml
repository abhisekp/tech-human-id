name: Create Tag

on:
  workflow_dispatch:
  push:
    branches: [master, "[0-9]*.x"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  tag:
    if: github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '.x'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Create a version tag only from the current validated release branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          node scripts/create-tag.mjs
