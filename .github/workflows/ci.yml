name: Validate package and website

on:
  push:
    branches: [master, "[0-9]*.x"]
  pull_request:
    branches: [master, "[0-9]*.x"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Validate source, packed package, release gate and website
        run: yarn verify
      - name: Check source formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: yarn format:check
      - name: Check committed bundles match their sources
        run: git diff --exit-code -- dist site/library.mjs index.html
